# Secret scanning (BOOTSTRAP 4.6): the default gitleaks ruleset plus this app's allowlist.
# A finding blocks the commit (pre-commit hook) and blocks promotion. Never allowlist a real secret:
# rotate it instead (factory secrets set ...). Allowlist only clearly fake test values, by exact path.
title = "factory app gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "fake values used in tests"
paths = [
  '''web/e2e/__screenshots__/.*''',
  '''package-lock\.json''',
]
