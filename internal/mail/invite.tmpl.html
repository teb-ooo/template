<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{.Heading}}</title>
</head>
<body style="margin:0;padding:24px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;line-height:1.6;">
<p>{{.Heading}}</p>
<p>{{.Intro}}</p>
{{if .Code}}<p>code: <strong>{{.Code}}</strong></p>
{{end}}<p><a href="{{.ActionURL}}" style="display:inline-block;padding:10px 18px;font-family:inherit;font-size:14px;text-decoration:none;color:#ffffff;background:#111111;border-radius:4px;">{{.ActionLabel}}</a></p>
<p style="font-size:12px;">{{.ActionURL}}</p>
</body>
</html>
